[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawless-sim"
version = "0.1.0"
description = "Vectorized physics foundation for the LAWLESS adaptive-control research project"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26", "PyYAML>=6.0", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
include = ["lawless*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
